[project]
name = "metascale-co-proto"
version = "0.1.0"
description = "Prototype of MetaScale-CO (learned value-of-computation controller) on TSP with classical operators"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "numba>=0.60",
  "scipy>=1.12",
  "pandas>=2.2",
  "torch>=2.3",
  "elkai>=2.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metascale_co"]
